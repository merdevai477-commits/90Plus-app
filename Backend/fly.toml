# Fly.io configuration for 90Plus Backend
app = "90plus-backend"
primary_region = "fra"  # Frankfurt - closest to Middle East

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  API_PREFIX = "/api"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

# WebSocket support
[[services.tcp_checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "30s"

[mounts]
  source = "data"
  destination = "/data"
