[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs between build and start; a failed migration fails the deploy and the
# previous deployment keeps serving. Also set on the service itself because
# config-as-code is deprecated by Railway.
preDeployCommand = ["npx prisma migrate deploy"]
# Exec node directly: under `npm run` SIGTERM never reached the app's shutdown
# handler (npm -> sh -> node), so in-flight settles could not drain.
startCommand = "node dist/src/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
