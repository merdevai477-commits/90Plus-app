<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="90Plus — نتائج مباشرة، كويزات، تنبؤات، وريلز كروية في تطبيق واحد." />
    <title>90Plus — حمّل التطبيق</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, #1a0035 0%, #2d0060 50%, #1a0035 100%);
        color: #f4f7f5;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .logo {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
        display: block;
        object-fit: contain;
      }
      h1 {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 8px;
      }
      .tagline {
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.6;
        margin-bottom: 32px;
        font-size: 1rem;
      }
      .stores {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .store-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 14px 20px;
        border-radius: 14px;
        text-decoration: none;
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        transition: transform 0.15s, opacity 0.15s;
      }
      .store-btn:hover {
        transform: translateY(-2px);
        opacity: 0.95;
      }
      .store-btn:active { transform: translateY(0); }
      .store-btn svg {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
      }
      .apple {
        background: #111;
        border: 1px solid #333;
      }
      .android {
        background: #1a472a;
        border: 1px solid #2d6a4f;
      }
      .footer {
        margin-top: 36px;
        font-size: 0.85rem;
        color: #6b7c72;
      }
      .footer a {
        color: #b794f6;
        text-decoration: none;
      }
      .footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/90Plus.png" width="120" height="120" alt="90Plus" />
      <h1>90Plus</h1>
      <p class="tagline">
        نتائج مباشرة، كويزات يومية، تنبؤات، ريلز، ومكافآت — كل ما يحتاجه مشجع الكرة في تطبيق واحد.
      </p>

      <div class="stores">
        <a
          class="store-btn apple"
          href="https://apps.apple.com/us/app/90plus/id6758296989"
          rel="noopener noreferrer"
          target="_blank"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.63 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          <span>حمّل من App Store</span>
        </a>

        <a
          class="store-btn android"
          href="https://play.google.com/store/apps/details?id=com.mhmdsh1892.ninetyplusapp"
          rel="noopener noreferrer"
          target="_blank"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M3 20.5V3.5C3 2.91 3.34 2.39 3.84 2.15L13.69 12 3.84 21.85C3.34 21.61 3 21.09 3 20.5m13.81-5.38L6.05 21.34 14.54 12.85l2.27 2.27m3.35-4.31c.34.27.59.69.59 1.19s-.25.92-.57 1.18l-2.29 1.32-2.5-2.5 2.5-2.5 2.27 1.31M6.05 2.66l10.76 6.22-2.27 2.27L6.05 2.66z"/>
          </svg>
          <span>حمّل من Google Play</span>
        </a>
      </div>

      <p class="footer">
        <a href="/support">الدعم</a>
        ·
        <a href="/privacy">الخصوصية</a>
        ·
        <a href="/terms">الشروط</a>
      </p>
    </main>
  </body>
</html>
